name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Built before the tests: the CLI suite drives dist/bin/jtcsv.js through
      # argv, and tsc:build only emits declarations. release.yml builds first
      # for the same reason.
      - run: npm run build
      - run: npm run tsc:check
      - run: npm run tsc:types
      - run: npm run test:types
      - run: npm run test:ci
      - run: npm run test:coverage:entry
      - run: npm run lint
      - run: npm run verify:browser

  macos-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:ci

  examples-smoke:
    runs-on: ubuntu-latest
    needs: [build-test]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Run 15 example smoke tests
        run: node scripts/run-examples.js

  coverage-badge:
    runs-on: ubuntu-latest
    needs: [build-test]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:coverage
      - run: npm run coverage:badge
      - name: Echo badge URL
        run: cat coverage/badge.json
