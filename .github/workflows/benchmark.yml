name: Performance Benchmarks

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'benchmark.ts'
      - 'benchmarks/**'
      - 'package.json'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'benchmark.ts'
      - 'benchmarks/**'
      - 'package.json'
  schedule:
    # Weekly benchmark
    - cron: '0 3 * * 0'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Run benchmarks
        # Kept `continue-on-error` on this step ONLY: CI runner variance
        # makes benchmark numbers noisy, and a benchmark slowdown is not
        # a security or correctness issue. The competitor head-to-head
        # in benchmark-vs-competitors.yml uses a 25 % regression alert
        # via benchmark-action/github-action-benchmark — that is the
        # actual gate; this job exists for raw artifact upload only.
        run: node dist/benchmark.js --ci --output benchmark-results.json
        continue-on-error: true
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: benchmark-results-${{ matrix.node-version }}
          path: benchmark-results.json
          retention-days: 30
      - name: Compare with baseline
        if: github.event_name == 'pull_request'
        run: |
          # This step would compare results with a baseline (e.g., previous commit)
          # For simplicity, we just log the results
          if [ -f benchmark-results.json ]; then
            echo "Benchmark results:"
            cat benchmark-results.json | jq '.'
          else
            echo "No benchmark results generated."
          fi
        shell: bash

  report:
    runs-on: ubuntu-latest
    needs: benchmark
    if: always()
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Download all benchmark artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: artifacts
      - name: Generate summary
        run: |
          echo "## Performance Benchmarks" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for file in artifacts/benchmark-results-*/*.json; do
            if [ -f "$file" ]; then
              node_version=$(echo "$file" | grep -oE '[0-9]+')
              echo "### Node.js $node_version" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "#### CSV to JSON" >> $GITHUB_STEP_SUMMARY
              cat "$file" | jq -r '.results.csvToJson[]? | "- \(.name): \(.opsPerSec) ops/sec (±\(.relativeMargin)%)"' >> $GITHUB_STEP_SUMMARY || true
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "#### JSON to CSV" >> $GITHUB_STEP_SUMMARY
              cat "$file" | jq -r '.results.jsonToCsv[]? | "- \(.name): \(.opsPerSec) ops/sec (±\(.relativeMargin)%)"' >> $GITHUB_STEP_SUMMARY || true
              echo "" >> $GITHUB_STEP_SUMMARY
            fi
          done
        shell: bash