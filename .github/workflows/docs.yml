name: Deploy docs to GitHub Pages

# Builds the typedoc API reference and deploys to GitHub Pages on every
# push to main. Combines with benchmark-vs-competitors.yml's gh-pages
# output (under /dev/bench/) into a single Pages site.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'docs/.vitepress/**'
      - 'package.json'
      - 'package-lock.json'
      - 'index.ts'
      - 'src/**/*.ts'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs-build:
    name: Build typedoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      # `npm run docs` writes the generated reference to docs/.typedoc
      # (gitignored). VitePress then builds the site from /docs, which
      # includes the four hand-authored pages in docs/api/*.md. Finally the
      # generated reference is layered into the site under /api/ — the two
      # sets do not share filenames.
      #
      # Do NOT point typedoc at docs/api: it runs with cleanOutputDir and
      # would delete those hand-authored pages before VitePress reads them.
      - name: Build typedoc and VitePress
        run: |
          npm run docs
          npm run site:build
          mkdir -p docs/.vitepress/dist/api
          cp -r docs/.typedoc/* docs/.vitepress/dist/api/
      - name: Mirror gh-pages /dev/bench into dist
        continue-on-error: true
        run: |
          tmp=$(mktemp -d)
          git clone --branch gh-pages --depth 1 https://github.com/${{ github.repository }}.git "$tmp" || exit 0
          if [ -d "$tmp/dev/bench" ]; then
            mkdir -p docs/.vitepress/dist/dev/bench
            cp -r "$tmp/dev/bench/." docs/.vitepress/dist/dev/bench/
          fi
          rm -rf "$tmp"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: ./docs/.vitepress/dist

  docs-deploy:
    name: Deploy to Pages
    needs: docs-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
