name: OpenSSF Scorecard

# Runs the OpenSSF Scorecard analysis weekly + on push to main, uploads
# results to GitHub's code-scanning UI, and (optionally) publishes them
# to the public Scorecard data feed at https://api.securityscorecards.dev/.
#
# Required for the Scorecard badge to display a fresh score in README.

on:
  branch_protection_rule:
  schedule:
    - cron: '0 4 * * 1'  # Mondays 04:00 UTC
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload SARIF to code-scanning
      id-token: write          # publish to OpenSSF data feed via OIDC
      contents: read
      actions: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF to code-scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SARIF results
          path: results.sarif
          retention-days: 5
