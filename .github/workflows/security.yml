name: Security Scanning

# All third-party actions are pinned to a commit SHA (with a comment
# showing the version that SHA corresponded to at pin time). Renew via
# scripts/refresh-action-shas.sh or manually with the GH API.
#
# The `snyk/actions/node@master` job was removed in Phase 1 Week 2:
#   - it was pinned to a sliding `master` branch (supply-chain risk);
#   - it required a SNYK_TOKEN secret we don't configure;
#   - CodeQL provides equivalent SAST coverage for this codebase.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Weekly security scan
    - cron: '0 2 * * 1'

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --audit=false

      # BLOCKING GATE — the dependency surface a consumer actually installs.
      #
      # A bare `npm audit` at the repo root audits the whole workspace tree:
      # blessed-contrib (jtcsv-tui), exceljs (jtcsv-excel), next, hono,
      # vitepress and every other sibling/dev tool. That tree carries dozens
      # of advisories at any time, so the gate failed every single run since
      # the workflow was added and stopped carrying information.
      #
      # `jtcsv` ships with `dependencies: {}` and one optional dep (glob), so
      # the honest question is: does installing the published tarball pull in
      # anything vulnerable? That is what this step measures, and it must
      # stay green. To suppress a genuine false-positive here, use a real npm
      # override in package.json, not a blanket workflow flag.
      - name: Audit the published dependency surface (blocking)
        run: |
          set -euo pipefail
          tarball="$(npm pack --silent | tail -n 1)"
          consumer="$RUNNER_TEMP/consumer"
          mkdir -p "$consumer"
          cd "$consumer"
          npm init -y > /dev/null
          npm install "$GITHUB_WORKSPACE/$tarball" --no-fund --no-audit > /dev/null
          npm audit --audit-level=moderate

      # REPORT ONLY — dev + workspace tooling. Visible, never blocking:
      # these never reach a consumer's node_modules.
      - name: Audit dev and workspace tooling (report only)
        continue-on-error: true
        run: |
          npm audit --audit-level=moderate | tee npm-audit.txt
          {
            echo '## Dev / workspace advisories (non-blocking)'
            echo ''
            echo '```'
            cat npm-audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write machine-readable report
        if: always()
        run: npm audit --json > npm-audit.json || true

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: npm-audit-report
          path: |
            npm-audit.json
            npm-audit.txt
          retention-days: 7

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@dd903d2e4f5405488e5ef1422510ee31c8b32357  # v3
        with:
          languages: javascript
      - name: Autobuild
        uses: github/codeql-action/autobuild@dd903d2e4f5405488e5ef1422510ee31c8b32357  # v3
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@dd903d2e4f5405488e5ef1422510ee31c8b32357  # v3
