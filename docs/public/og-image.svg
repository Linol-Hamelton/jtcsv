<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="jtcsv — JSON ↔ CSV toolkit">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0EA5A4"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="630" fill="url(#bg)"/>

  <!-- Mark, top-right corner, 64x64 at (1056,72) -->
  <g transform="translate(1056 72)">
    <rect x="0" y="0" width="64" height="64" rx="14" ry="14" fill="#FFFFFF"/>
    <rect x="18" y="16" width="28" height="4" rx="2" ry="2" fill="#0EA5A4"/>
    <rect x="18" y="44" width="28" height="4" rx="2" ry="2" fill="#0EA5A4"/>
    <line x1="22" y1="32" x2="42" y2="32" stroke="#0EA5A4" stroke-width="2" stroke-linecap="round"/>
    <polygon points="18,32 24,28 24,36" fill="#0EA5A4"/>
    <polygon points="46,32 40,28 40,36" fill="#0EA5A4"/>
  </g>

  <!-- Title -->
  <text x="80" y="320" font-family="'JetBrains Mono', 'DM Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="144" font-weight="700" fill="#FFFFFF" letter-spacing="-0.03em">jtcsv</text>

  <!-- Sub-line -->
  <text x="80" y="400" font-family="'JetBrains Mono', 'DM Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="48" font-weight="400" fill="#E2E8F0">JSON ↔ CSV toolkit for Node.js and browser</text>

  <!-- Pillar chips at y=500 -->
  <g font-family="'JetBrains Mono', 'DM Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="28" font-weight="500" fill="#FFFFFF">
    <g transform="translate(80 500)">
      <rect x="0" y="0" width="200" height="56" rx="28" ry="28" fill="#FFFFFF22" stroke="#FFFFFF66" stroke-width="1"/>
      <text x="24" y="37">~18 KB gz</text>
    </g>
    <g transform="translate(300 500)">
      <rect x="0" y="0" width="288" height="56" rx="28" ry="28" fill="#FFFFFF22" stroke="#FFFFFF66" stroke-width="1"/>
      <text x="24" y="37">Zero runtime deps</text>
    </g>
    <g transform="translate(608 500)">
      <rect x="0" y="0" width="448" height="56" rx="28" ry="28" fill="#FFFFFF22" stroke="#FFFFFF66" stroke-width="1"/>
      <text x="24" y="37">CSV injection guard by default</text>
    </g>
  </g>
</svg>
